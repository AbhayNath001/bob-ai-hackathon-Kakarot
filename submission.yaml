submission:
  title: "Predicting selective MMP-12 inhibitors requires advanced deep learning for chemical-space-guided selectivity, 3D protein structure, and ligand-aware binding affinity prediction."
  problem_statement: >
    Selective MMP-12 inhibitor prediction remains challenging because MMP family members possess highly similar catalytic architectures, while molecular activity, selectivity, protein conformation, and ligand binding are strongly interdependent. Conventional ligand-based approaches can predict inhibitory activity and selectivity from molecular features, but they do not directly provide ligand-conditioned protein structures or structure-aware binding assessment. Conversely, conventional structure-based workflows generally treat protein prediction, docking, and affinity estimation as separate stages.

  solution_summary: >
    We propose an integrated AI-driven framework that addresses these limitations through three complementary components. First, the MSR-ARN (Multi-Scale Residual Attentive Regression Network) analyzes molecular fingerprints and chemical-space relationships using multi-scale residual convolutions, dilated gated convolutions, squeeze-and-excitation attention, self-attention, and feature modulation to predict MMP-12 inhibitory activity and identify selective inhibitors. Second, a diffusion-transformer-based ligand-aware folding module predicts 3D protein conformations conditioned on ligand information through pairwise attention and SE(3)-equivariant coordinate refinement. Third, an SE(3)-equivariant ligand-aware docking and affinity module iteratively refines ligand poses and predicts binding energy using geometric graph representations and differentiable optimization. Together, these components enable chemical-space-guided selectivity prediction, ligand-conditioned 3D structure prediction, and in-silico binding affinity scoring within a unified drug-discovery pipeline.

